
name: Gerar APK MT7 Keymapper

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK MT7
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto DEV13
        run: |
          ZIP="./MT7_Keymapper_3.11.0-dev13_seta_propria_mt7.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP DEV13 não encontrado."
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT=$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Gradle não encontrado."
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Corrigir dependência ViewTreeLifecycleOwner
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERRO: app/build.gradle.kts não encontrado."
            exit 1
          fi

          if ! grep -q 'androidx.lifecycle:lifecycle-runtime:' "$FILE"; then
            sed -i '/dependencies {/a\    implementation("androidx.lifecycle:lifecycle-runtime:2.8.7")' "$FILE"
          fi

          echo "Dependências Lifecycle configuradas:"
          grep -n 'lifecycle' "$FILE" || true

      - name: Verificar dependências Android
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:dependencies \
            --configuration debugCompileClasspath

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Limpar compilação anterior
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean

      - name: Executar testes e compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MT7-Keymapper-DEV13-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
