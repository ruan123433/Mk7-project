
name: MT7 Keymapper - Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar ferramentas Android
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Extrair arquivos ZIP
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "MT7-Keymapper-3.11.0-dev17-lifecycle-294-fix.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP dev17 nao encontrado."
            echo "Confira se o arquivo foi enviado ao repositorio."
            exit 1
          fi

          echo "Extraindo: $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Localizar projeto Android
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            echo "Confira a estrutura do ZIP dev17."
            exit 1
          fi

          BUILD_DIR=$(dirname "$SETTINGS_FILE")

          echo "Projeto encontrado em: $BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK Debug
        run: |
          cd "$BUILD_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          APK=$(find "$BUILD_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MT7-Keymapper-dev17-APK
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
