
name: Gerar APK MT7 Keymapper

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair ZIP DEV13
        run: |
          unzip -q MT7_Keymapper_3.11.0-dev13_seta_propria_mt7.zip -d source
          echo "PROJECT_DIR=$(find source -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Executar testes e compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MT7-Keymapper-DEV13-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
